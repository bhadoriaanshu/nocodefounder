[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  included_files = ["private/**"]

# --- Canonicalization: consolidate SEO signals onto the apex domain ---
# If www.nocodefounder.site is ever pointed at this site, permanently
# redirect it to the apex so Google/AI crawlers only ever see one canonical
# host (avoids duplicate-content splitting of ranking signals).
[[redirects]]
  from = "https://www.nocodefounder.site/*"
  to = "https://nocodefounder.site/:splat"
  status = 301
  force = true

# --- Caching: long-lived immutable cache for hashed Next.js build assets ---
# Improves Core Web Vitals / repeat-visit load time, which factors into both
# organic ranking and Google Ads Landing Page Experience / Quality Score.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# --- Security & trust headers (also a minor Google ranking / trust signal) ---
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
